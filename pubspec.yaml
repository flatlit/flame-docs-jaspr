name: jaspr_poc
description: A documentation site built with Jaspr
version: 0.0.1

environment:
  sdk: ^3.13.0

dependencies:
  jaspr: ^0.23.5
  jaspr_content: ^0.5.4
  jaspr_router: ^0.9.0
  jaspr_lucide: ^0.55.0
  flutter:
    sdk: flutter
  flutter_shaders:
  jaspr_flutter_embed: ^0.4.11
  flame: ^2.0.0-dev.1
  flame_rive: ^2.0.0-dev.1
  material_ui: ^1.0.0
  web: ^1.1.0
  # cupertino_ui: any

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.23.5
  lints: ^5.0.0

jaspr:
  mode: static
  flutter: embedded
  styles: standalone

flutter:
  uses-material-design: true